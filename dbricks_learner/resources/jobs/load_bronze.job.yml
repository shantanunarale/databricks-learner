resources:
  jobs:
    load_bronze:
      name: load_bronze
      tasks:
        - task_key: process_customer
          notebook_task:
            notebook_path: ../../src/notebook/python/customer-bronze.ipynb
            source: WORKSPACE
        - task_key: process_sales
          depends_on:
            - task_key: process_customer
          notebook_task:
            notebook_path: ../../src/notebook/python/sales-bronze.ipynb
            base_parameters:
              input_df: sales
            source: WORKSPACE
        - task_key: process_sales_order
          depends_on:
            - task_key: process_customer
          notebook_task:
            notebook_path: ../../src/notebook/python/sales-bronze.ipynb
            base_parameters:
              file_to_process: sales_orders
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: retail_store_dev
      performance_target: PERFORMANCE_OPTIMIZED
