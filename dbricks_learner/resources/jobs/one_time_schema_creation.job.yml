resources:
  jobs:
    one_time_schema_creation:
      name: one_time_schema_creation      
      tasks:
        - task_key: deploy_schemas
          notebook_task:
            notebook_path: ../../src/notebook/env_setup.ipynb
            source: WORKSPACE      
      parameters:
        - name: catalog_name
          default: ${var.catalog}        
        - name: account_name
          default: ${var.account_name}
      performance_target: PERFORMANCE_OPTIMIZED
